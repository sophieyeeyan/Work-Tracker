<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <h1 class="header-title">Corporate Slave Mental Health Tracker</h1>
  </header>

  <div class="login-wrapper">
    <div class="login-container">
      <h2>Welcome to Mood Tracker</h2>
      <img src="images/Work.png" alt="Work Image" class="login-image" />
      <p class="login-description">
        This tracker gives you visibility on whether you are going insane at work.
      </p>
      <input type="text" id="nameInput" placeholder="Enter your name" />
    </div>
  </div>

  <script>
    document.getElementById('nameInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const name = e.target.value.trim();
        if (name) {
          localStorage.setItem('userName', name);
          window.location.href = 'dashboard.html';
        }
      }
    });
  </script>
</body>
</html>
